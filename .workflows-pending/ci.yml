name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Unit and integration tests (offline, 144 assertions)
        run: npm test
      - name: TypeScript strict check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Production build
        run: npm run build
      - name: Native projects present and intact
        run: |
          test -f android/app/build.gradle && test -x android/gradlew
          test -f ios/App/App.xcodeproj/project.pbxproj && test -f ios/App/App.xcworkspace && test -f ios/App/Podfile
          test -f src-tauri/tauri.conf.json && test -f src-tauri/Cargo.toml && test -f src-tauri/icons/icon.icns && test -f src-tauri/icons/icon.ico
          test -f capacitor.config.ts && test -f public/manifest.webmanifest
          echo "All native projects validated."
