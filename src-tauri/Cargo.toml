[package]
name = "sophira"
version = "0.1.0"
description = "Sophira — Your private academic AI assistant (desktop shell)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "sophira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
